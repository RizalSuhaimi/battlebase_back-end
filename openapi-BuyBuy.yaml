openapi: 3.0.3
info:
  title: BuyBuy
  version: 1.0.0
  description: An API for an e-commerce web application
servers:
  - url: http://localhost:4001
    variables: {}
    description: Local development server
paths:
  /users:
    summary: Access all users
    description: This path will grant access to all the users from the postgres database
    get:
      summary: Gets the users' data
      description: Gets the users' data from the postgres database
      operationId: get_users
      responses:
        '200':
          content:
            application/json:
              examples:
                users:
                  value: |-
                    {"users": [
                      {"id": "0000000001", "name": "Rachel Chan", 
                      "username": "rachelc1", "email": "rachelc@email.com", 
                      "phone": "+60110000000", "address_id": "0000000001", "seller": true}, 
                      {"id": "0000000002", "name": "Michael Chan", 
                      "username": "michaelc1", "email": "michaelc@email.com", "phone": "+60110000001", "address_id": "0000000002", "seller": false}, 
                      {"id": "0000000003", "name": "Amber Chan", 
                      "username": "amberc1", "email": "amberc@email.com", "phone": "+60110000002", "address_id": null, "seller": true}
                    ]}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Users
    post:
      summary: Register a new user
      description: This operation adds a new user to the postgres database
      operationId: post_user
      requestBody:
        description: A new user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          content:
            application/json:
              examples:
                newUser:
                  value: |-
                    {"message": "User created successfully",
                      "userId": "0000000003"}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Users
  /users/{userId}:
    summary: Access a specific user
    description: >-
      This path will grant access to the user with a matching ID from the 
      postgres database
    get:
      summary: Gets a specific user's data
      description: >-
        This operation will get the user's data with a matching ID from the 
        postgres database
      operationId: get_user
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          content:
            application/json:
              examples:
                users:
                  value: |-
                    {"id": "0000000002", "name": "Amber Chan", 
                      "email": "amberc@email.com", "phone": "+60110000002", 
                      "address_id": "0000000001", "seller": false}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Users
    put:
      summary: Updates a specific user's data
      description: >-
        This operation will update the user's data with a matching ID from the 
        postgres database
      operationId: put_user
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        description: An updated user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          content:
            application/json:
              examples:
                users:
                  value: |-
                    {"id": "0000000002", "name": "Amber Chan", 
                      "email": "amberc@email.com", "phone": "+60120000002", 
                      "address_id": "0000000002", "seller": true}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Users
    delete:
      summary: Deletes a specific user's data
      description: >-
        This operation will delete the user's data with a matching ID from the 
        postgres database
      operationId: delete_user
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Users
  /addresses:
    summary: Access all addresses
    description: This path will grant access to all the addresses from the postgres database
    get:
      summary: Gets the addresses data
      description: Gets the addresses data from the postgres database
      operationId: get_addresses
      responses:
        '200':
          content:
            application/json:
              examples:
                users:
                  value: |-
                    {"addresses": [
                      {"id": "0000000001", "unit_number": "1", 
                      "floor_number": "1", "building_name": "Imazium", 
                      "street": "Baker Street", "city": "Metropolis",
                      "region_id": 3, "zone": "Johor", "country": "Malaysia"}, 
                      {"id": "0000000002", "unit_number": "3", 
                      "floor_number": "1", "building_name": "Imazium", 
                      "street": "Baker Street", "city": "Metropolis",
                      "region_id": 3, "zone": "Johor", "country": "Malaysia"}, 
                      {"id": "0000000003", "unit_number": "3", 
                      "floor_number": "1", "building_name": "Imazium", 
                      "street": "Baker Street", "city": "Metropolis",
                      "region_id": 3, "zone": "Johor", "country": "Malaysia"}
                    ]}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Addresses
    post:
      summary: Register a new address
      description: This operation adds a new address to the postgres database
      operationId: post_address
      requestBody:
        description: A new address object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          content:
            application/json:
              examples:
                newUser:
                  value: |-
                    {
                      "message": "New address created", 
                      "addressId": "0000000001"
                    }
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Addresses
  /addresses/{addressId}:
    summary: Access all addresses
    description: This path will grant access to all the addresses from the postgres database
    get:
      summary: Gets the specific address data
      description: Gets the address data with the matching addressId from the postgres database
      operationId: get_address
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '200':
          content:
            application/json:
              examples:
                users:
                  value: |-
                    {"id": "0000000001", "unit_number": "1", 
                      "floor_number": "1", "building_name": "Imazium", 
                      "street": "Baker Street", "city": "Metropolis",
                      "region_id": 3, "zone": "Johor", "country": "Malaysia"}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Addresses
    put:
      summary: Updates the specific address data
      description: Updates the address data with the matching addressId from the postgres database
      operationId: put_address
      parameters:
        - $ref: '#/components/parameters/addressId'
      requestBody:
        description: A new address object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          content:
            application/json:
              examples:
                address:
                  value: |-
                    {"id": "0000000001", "unit_number": "1", 
                      "floor_number": "1", "building_name": "Imazium", 
                      "street": "Baker Street", "city": "Metropolis",
                      "region_id": 3, "zone": "Johor", "country": "Malaysia"}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Addresses
    delete:
      summary: Deletes the specific address data
      description: Deletes the address data with the matching addressId from the postgres database
      operationId: delete_address
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '204':
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Addresses
  /orders:
    summary: Access all orders
    description: This path grants access to the all orders from the postgres database
    post:
      summary: Create a new order
      description: >-
        This operation will create a new order in the database using the id of the 
        buyer and seller
      operationId: post_order
      requestBody:
        description: A new user object
        content:
          application/json: 
            schema:
              type: object
              properties:
                sellerId:
                  type: string
                buyerId:
                  type: string
                dateTime:
                  type: string
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      productName:
                        type: string
                      price:
                        type: number
                      quantity:
                        type: integer
                recipientAddress:
                  type: object
                  properties:
                    unitNumber:
                      type: string
                    floorNumber:
                      type: integer
                    street:
                      type: string
                    city:
                      type: string
                    postcode:
                      type: string
                    zone:
                      type: string
                    country:
                      type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                orders:
                  value: |-
                      {"orderId": "10000000000000000000",
                      "sellerName": "Rachel Chan",
                      "products": [
                        {"productId": "0000000000000000000B", 
                        "productName": "Beyblade Storm Pegasus",
                        "price": 20.00, "Quantity": 2},
                        {"productId": "0000000000000000000C",
                        "productName": "Beyblade Fang Leone",
                        "price": 20.00, "Quantity": 1}
                      ]}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Orders
  /users/{userId}/orders/buyer:
    summary: Access user's buying orders
    description: This path grants access to the user's buying orders from the postgres database
    get:
      summary: Get the user's past buying orders
      description: >-
        This operation will get the past buying orders of the user with a matching ID
        from the database
      operationId: get_orders_buy
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          content:
            application/json:
              examples:
                orders:
                  value: |-
                    [
                      {"orderId": "10000000000000000000",
                      "sellerName": "Rachel Chan",
                      "products": [
                        {"productId": "0000000000000000000B", 
                        "productName": "Beyblade Storm Pegasus",
                        "price": 20.00, "Quantity": 2},
                        {"productId": "0000000000000000000C",
                        "productName": "Beyblade Fang Leone",
                        "price": 20.00, "Quantity": 1}
                      ]},
                      {"orderId": "20000000000000000000",
                      "sellerName": "Rachel Chan",
                      "products": [
                        {"productId": "0000000000000000000B", 
                        "productName": "Beyblade Diablo Nemesis",
                        "price": 20.00, "Quantity": 2},
                        {"productId": "0000000000000000000C",
                        "productName": "Beyblade Fang Leone",
                        "price": 20.00, "Quantity": 1}
                      ]}
                    ]
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Orders

  /users/{userId}/orders/seller:
    summary: Access user's selling orders
    description: This path grants access to the user's selling orders from the postgres database
    get:
      summary: Get the user's past selling orders
      description: >-
        This operation will get the past selling orders of the user with a matching ID
        from the database
      operationId: get_orders_sell
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          content:
            application/json:
              examples:
                orders:
                  value: |-
                    [
                      {"orderId": "10000000000000000000",
                      "sellerName": "Rachel Chan",
                      "products": [
                        {"productId": "0000000000000000000B", 
                        "productName": "Beyblade Storm Pegasus",
                        "price": 20.00, "Quantity": 2},
                        {"productId": "0000000000000000000C",
                        "productName": "Beyblade Fang Leone",
                        "price": 20.00, "Quantity": 1}
                      ]},
                      {"orderId": "20000000000000000000",
                      "sellerName": "Rachel Chan",
                      "products": [
                        {"productId": "0000000000000000000B", 
                        "productName": "Beyblade Diablo Nemesis",
                        "price": 20.00, "Quantity": 2},
                        {"productId": "0000000000000000000C",
                        "productName": "Beyblade Fang Leone",
                        "price": 20.00, "Quantity": 1}
                      ]}
                    ]
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Orders
  /users/{userId}/orders/{orderId}:
    summary: Access a specific order
    description: This path grants access to the user's specific order from the postgres database
    delete:
      summary: Delete order
      description: >-
        This operation allows the user to delete an order
        from the database
      operationId: delete_order
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/orderId'
      responses:
        '204':
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Orders
  /users/{userId}/cart:
    summary: Access user's cart
    description: This path grants access to the user's cart from the postgres database
    get:
      summary: Get the user's cart
      description: >-
        This operation will get cart of the user with a matching ID from the
        database
      operationId: get_cart
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          content:
            application/json:
              examples:
                cart:
                  value: |-
                    [
                      {"productId": "000000000000000a", "productName": "Beyblade Storm Pegasus",
                      "price": 20.00, "Quantity": 2, "sellerName": "Rachel Chan"},
                      {"productId": "000000000000000b","productName": "Beyblade Fang Leone",
                      "price": 20.00, "Quantity": 1, "sellerName": "Rachel Chan"}
                    ]
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Cart
    put:
      summary: Update the user's cart
      description: >-
        This operation will update cart of the user with items of matching ID
        from the database
      operationId: put_cart
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        description: An updated cart object
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  productId:
                    type: string
                    example: '0000000000012345'
                  productname:
                    type: string
                    example: Beyblade Mercury Anubis
                  price:
                    type: number
                    example: 20
                  quantity:
                    type: integer
                    example: 2
                required:
                  - productId
                  - productName
                  - price
                  - quantity
      responses:
        '200':
          content:
            application/json:
              examples:
                updatedCart:
                  value: |-
                    [
                      {"productId": "000000000000000a", "productName": "Beyblade Storm Pegasus",
                      "price": 20.00, "Quantity": 5, "sellerName": "Rachel Chan"},
                      {"productId": "000000000000000b","productName": "Beyblade Fang Leone",
                      "price": 20.00, "Quantity": 3, "sellerName": "Rachel Chan"}
                    ]
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Cart
    delete:
      summary: Delete the user's cart
      description: >-
        This operation will delete cart of the user with items of matching ID
        from the database
      operationId: delete_cart
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Cart
  /checkout/{userId}:
    summary: Check out cart items
    description: >- 
      This path is for users to check out their cart items and finish placing their order
    get:
      summary: Place the order and make the payment
      description: Place the order and make the payment. Update the user's corresponding data on orders and cart. Update the seller(s)'s corresponding data on orders and products
      operationId: checkout
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          content:
            application/json:
              examples:
                order:
                  value: |-
                    [
                      {"productId": "000000000000000a", "productName": "Beyblade Storm Pegasus",
                      "price": 20.00, "Quantity": 2, "sellerName": "Rachel Chan"},
                      {"productId": "000000000000000b","productName": "Beyblade Fang Leone",
                      "price": 20.00, "Quantity": 1, "sellerName": "Rachel Chan"}
                    ]
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Checkout
  /products:
    summary: Access all products
    description: This path will grant access to all the products from the postgres database
    get:
      summary: Get the products' data
      description: Get the products' data from the postgres database
      operationId: get_products
      responses:
        '200':
          content:
            application/json:
              examples:
                products:
                  value: |-
                    {"products": [
                      {"id": "00000000000000000000", "name": "Beyblade Storm Pegasus", 
                      "stock": 10, "price": 20.00, "seller_id": "0000000000000000000a"}, 
                      {"id": "00000000000000000001", "name": "Beyblade Earth Eagle", 
                      "stock": 9, "price": 20.00, "seller_id": "0000000000000000000b"}, 
                      {"id": "00000000000000000002", "name": "Beyblade Ray Unicorno", 
                      "stock": 8, "price": 20.00, "seller_id": "0000000000000000000c"}
                    ]}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Products
    post:
      summary: Add a new product
      description: This operation adds a new product to the postgres database
      operationId: post_product
      requestBody:
        description: A new product object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          content:
            application/json:
              examples:
                newProduct:
                  value: |-
                    {"newProduct": 
                      {"id": "00000000000000000003", "name": "Beyblade Gravity Perseus", 
                      "stock": 7, "price": 20.00, "seller_id": "0000000000000000000c"}
                    }
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Products
  /products/{productId}:
    summary: Access the specific product
    description: >-
      This path will grant access to the product with a matching ID from the
      postgres database
    get:
      summary: Gets a specific product's data
      description: >-
        This operation will get the product's data with a matching ID from the 
        postgres database
      operationId: get_product
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          content:
            application/json:
              examples:
                product:
                  value: >-
                    {"id": "00000000000000000003", "name": "Beyblade Gravity
                    Perseus", 
                      "stock": 7, "price": 20.00, "seller_id": "0000000000000000000c"}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Products
    put:
      summary: Updates a specific product's data
      description: >-
        This operation will update the product's data with a matching ID from
        the  postgres database
      operationId: put_product
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        description: A new product object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          content:
            application/json:
              examples:
                product:
                  value: |-
                    {"id": "00000000000000000000", "name": "Big Bang Pegasus", 
                      "stock": 7, "price": 20.00, "seller_id": "0000000000000000000a"}
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Products
    delete:
      summary: Deletes a specific product's data
      description: >-
        This operation will delete the product's data with a matching ID from
        the  postgres database
      operationId: delete_product
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '204':
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Products
  /authe/login:
    summary: User logs in to their account
    description: User will pass credentials to this path to log into their account
    post:
      summary: User logs in to their account
      description: >-
        This operation will check the user credentials with the database and
        logs the user into their account
      operationId: post_login
      requestBody:
        description: User credentials
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          content:
            text/plain; charset=utf-8:
              examples:
                loginSuccess:
                  value: You have logged in
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Authentication
  /authe/logout:
    summary: User logs out of their account
    description: User will log out of the app(session)
    get:
      summary: User logs out of their account
      description: This operation lets the user log out of their account
      operationId: get_logout
      responses:
        '201':
          content:
            text/plain; charset=utf-8:
              examples:
                loginSuccess:
                  value: You have logged in
          description: Success
        '400':
          content:
            text/plain; charset=utf-8:
              examples:
                error:
                  value: Bad request
          description: Bad request
      tags:
        - Authentication
components:
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        seller:
          type: boolean
        address_id:
          type: string
    Address:
      type: array
      items:
        type: object
        properties:
          unitNumber:
            type: string
          floorNumber:
            type: integer
          street:
            type: string
          city:
            type: string
          postcode:
            type: string
          zone:
            type: string
          country:
            type: string
    Product:
      type: object
      properties:
        name:
          type: string
        stock:
          type: integer
        price:
          type: number
        seller_id:
          type: string
  parameters:
    userId:
      name: userId
      in: path
      description: The id of the user
      required: true
      schema:
        type: string
    addressId:
      name: addressId
      in: path
      description: The id of the address
      required: true
      schema:
        type: string
    orderId:
      name: orderId
      in: path
      description: The id of the order
      required: true
      schema:
        type: string
    sellerId:
      name: sellerId
      in: path
      description: The id of the seller
      required: true
      schema:
        type: string
    productId:
      name: productId
      in: path
      description: The id of the product
      required: true
      schema:
        type: string
